name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local:
    name: Local Typecheck And Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentrouter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENTROUTER_API_KEY: ar_ci_${{ github.run_id }}_${{ github.run_attempt }}
      AGENTROUTER_HEARTBEAT_INTERVAL_SECONDS: "30"
      AGENTROUTER_STALE_HEARTBEAT_GRACE_SECONDS: "180"
      AGENTROUTER_TEST_RESOURCE_PREFIX: ar_ci_${{ github.run_id }}_${{ github.run_attempt }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentrouter_test
      DAYTONA_API_KEY: daytona_ci_placeholder
      DAYTONA_SANDBOX_TTL_SECONDS: "900"
      OPENAI_API_KEY: sk-ci-placeholder
      R2_ACCESS_KEY_ID: r2-ci-placeholder
      R2_ACCOUNT_ID: r2-ci-placeholder
      R2_ARTIFACT_PREFIX: ci/${{ github.run_id }}/local/
      R2_BUCKET: agentrouter-ci-placeholder
      R2_ENDPOINT: https://example.r2.cloudflarestorage.com
      R2_REGION: auto
      R2_SECRET_ACCESS_KEY: r2-ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run local tests
        run: pnpm test:ci

  external-smoke:
    name: External Smoke Tests
    runs-on: ubuntu-latest
    needs: local
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentrouter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENTROUTER_API_KEY: ar_ci_${{ github.run_id }}_${{ github.run_attempt }}
      AGENTROUTER_HEARTBEAT_INTERVAL_SECONDS: "30"
      AGENTROUTER_STALE_HEARTBEAT_GRACE_SECONDS: "180"
      AGENTROUTER_TEST_RESOURCE_PREFIX: ar-ci-${{ github.run_id }}-${{ github.run_attempt }}-smoke
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentrouter_test
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_SANDBOX_TTL_SECONDS: "900"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ARTIFACT_PREFIX: ci/${{ github.run_id }}/external-smoke/
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: auto
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install provider CLIs
        run: npm install -g @openai/codex @anthropic-ai/claude-code@latest

      - name: Validate external test secrets
        run: |
          for name in DAYTONA_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY R2_ACCESS_KEY_ID R2_ACCOUNT_ID R2_BUCKET R2_ENDPOINT R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - name: Run external smoke tests
        run: pnpm test:external

  e2e-codex:
    name: Codex E2E
    runs-on: ubuntu-latest
    needs: local
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentrouter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENTROUTER_API_KEY: ar_ci_${{ github.run_id }}_${{ github.run_attempt }}
      AGENTROUTER_HEARTBEAT_INTERVAL_SECONDS: "30"
      AGENTROUTER_STALE_HEARTBEAT_GRACE_SECONDS: "180"
      AGENTROUTER_TEST_RESOURCE_PREFIX: ar-ci-${{ github.run_id }}-${{ github.run_attempt }}-codex
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentrouter_test
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_SANDBOX_TTL_SECONDS: "900"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ARTIFACT_PREFIX: ci/${{ github.run_id }}/e2e-codex/
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: auto
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Codex E2E secrets
        run: |
          for name in DAYTONA_API_KEY OPENAI_API_KEY R2_ACCESS_KEY_ID R2_ACCOUNT_ID R2_BUCKET R2_ENDPOINT R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - name: Run Codex E2E
        run: pnpm test:e2e:codex

  e2e-claude:
    name: Claude Code E2E
    runs-on: ubuntu-latest
    needs: local
    if: github.event_name != 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentrouter_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENTROUTER_API_KEY: ar_ci_${{ github.run_id }}_${{ github.run_attempt }}
      AGENTROUTER_HEARTBEAT_INTERVAL_SECONDS: "30"
      AGENTROUTER_STALE_HEARTBEAT_GRACE_SECONDS: "180"
      AGENTROUTER_TEST_RESOURCE_PREFIX: ar-ci-${{ github.run_id }}-${{ github.run_attempt }}-claude
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentrouter_test
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_SANDBOX_TTL_SECONDS: "900"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ARTIFACT_PREFIX: ci/${{ github.run_id }}/e2e-claude/
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: auto
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Claude Code E2E secrets
        run: |
          for name in DAYTONA_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY R2_ACCESS_KEY_ID R2_ACCOUNT_ID R2_BUCKET R2_ENDPOINT R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
