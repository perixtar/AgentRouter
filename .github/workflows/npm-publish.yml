name: Publish SDK to npm

on:
  pull_request:
    paths:
      - ".github/workflows/npm-publish.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/sdk-typescript/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/npm-publish.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/sdk-typescript/**"
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: Package SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @agentrouterhq/sdk build

      - name: Validate package contents
        working-directory: packages/sdk-typescript
        run: npm pack --dry-run

  publish:
    name: Publish SDK
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @agentrouterhq/sdk build

      - name: Validate npm token
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Missing NPM_TOKEN GitHub secret"
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure version is unpublished
        working-directory: packages/sdk-typescript
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@agentrouterhq/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@agentrouterhq/sdk@${VERSION} is already published. Bump packages/sdk-typescript/package.json before merging."
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/sdk-typescript
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
