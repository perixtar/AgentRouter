openapi: 3.1.0
info:
  title: AgentRouter Runtime API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /v1/runs:
    get:
      operationId: listRuns
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, queued, starting, running, cancelling, cancelled, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
    post:
      operationId: createRun
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/session:
    get:
      operationId: restoreRunSession
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Replayable session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSession"
  /v1/runs/{runId}/stream:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
  /v1/runs/{runId}/events:
    get:
      operationId: listRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Ordered event page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfterSeq]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunEvent"
                  nextAfterSeq:
                    type: integer
  /v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run cancel requested or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
  /v1/runs/{runId}/actions/{actionId}/approve:
    post:
      operationId: approveRunAction
      description: Approve a pending action using the canonical action digest from approval.requested.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunActionDecisionRequest"
      responses:
        "200":
          description: Approval decision event, or the existing same decision for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/actions/{actionId}/deny:
    post:
      operationId: denyRunAction
      description: Deny a pending action using the canonical action digest from approval.requested.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunActionDecisionRequest"
      responses:
        "200":
          description: Approval decision event, or the existing same decision for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/messages:
    post:
      operationId: continueRun
      description: >
        Continue a run-id conversation. The path runId is the stable
        conversation id, which is the first run id. The response runId is the
        newly-created run for this follow-up turn.
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageRequest"
      responses:
        "202":
          description: Follow-up turn enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinueRunResult"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/turns:
    get:
      operationId: getRunTurns
      description: List turns for a run-id conversation.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Conversation turns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTurnsResult"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/close:
    post:
      operationId: closeRun
      description: Close a run-id conversation and arm sandbox reclaim.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Conversation closed or already not reclaimable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseRunResult"
        "404":
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/artifacts:
    get:
      operationId: listRunArtifacts
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: R2-backed artifacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
  /v1/runs/{runId}/artifacts/{artifactId}/download:
    get:
      operationId: downloadRunArtifact
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Typed API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RuntimeKind:
      type: string
      enum: [codex, claude_code]
    CodexRuntimeMode:
      type: string
      enum: [default, read_only, full_access, auto_review]
    ClaudeCodePermissionMode:
      type: string
      enum: [default, acceptEdits, plan, auto, dontAsk, bypassPermissions]
    RuntimeModel:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._:/-]+$"
      description: Provider model name or alias passed to the selected runtime CLI.
    ActionApprovalMode:
      type: string
      enum: [auto, manual, block]
      description: >
        auto emits action/policy/execution events and runs immediately; manual emits
        approval.requested and waits for approveRunAction/denyRunAction; block emits
        a terminal policy denial and never starts provider execution.
    RuntimeSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              const: codex
            mode:
              $ref: "#/components/schemas/CodexRuntimeMode"
            model:
              $ref: "#/components/schemas/RuntimeModel"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              const: claude_code
            permissionMode:
              $ref: "#/components/schemas/ClaudeCodePermissionMode"
            model:
              $ref: "#/components/schemas/RuntimeModel"
    ResolvedRuntimeSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, mode]
          properties:
            kind:
              const: codex
            mode:
              $ref: "#/components/schemas/CodexRuntimeMode"
            model:
              $ref: "#/components/schemas/RuntimeModel"
        - type: object
          additionalProperties: false
          required: [kind, permissionMode]
          properties:
            kind:
              const: claude_code
            permissionMode:
              $ref: "#/components/schemas/ClaudeCodePermissionMode"
            model:
              $ref: "#/components/schemas/RuntimeModel"
    RunStatus:
      type: string
      enum: [queued, starting, running, cancelling, cancelled, completed, failed]
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task:
          type: string
          minLength: 1
        runtime:
          $ref: "#/components/schemas/RuntimeSelection"
        approvalMode:
          $ref: "#/components/schemas/ActionApprovalMode"
        metadata:
          type: object
          additionalProperties: true
    RunActionDecisionRequest:
      type: object
      additionalProperties: false
      required: [actionDigest]
      properties:
        actionDigest:
          type: string
          pattern: "^sha256:.+$"
          description: Canonical action digest copied from approval.requested.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    Run:
      type: object
      required: [id, status, runtime, task, input, lastEventSeq, queuedAt]
      properties:
        id:
          type: string
          description: Run id for this specific run or turn.
        conversationId:
          type: string
          description: Stable conversation id. For multi-turn conversations this is the first run id.
        sessionId:
          anyOf:
            - type: string
            - type: "null"
          description: Internal session id when a run has been promoted for continuation.
        status:
          $ref: "#/components/schemas/RunStatus"
        runtime:
          $ref: "#/components/schemas/ResolvedRuntimeSelection"
        task:
          type: string
        input:
          type: object
          additionalProperties: true
        lastEventSeq:
          type: integer
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelRequestedAt:
          type: string
          format: date-time
        failure:
          type: object
          properties:
            code:
              type: string
            reason:
              type: string
    RunEvent:
      type: object
      description: >
        Persisted run event. Known public event types include action.proposed,
        policy.evaluated, approval.requested, approval.decided,
        execution.started, execution.completed, execution.failed,
        agent.started, agent.progress, agent.no_progress, agent.message,
        agent.response, agent.error, provider.stdout,
        workspace.file_index_collected, workspace.patch_collected,
        run.completed, run.failed, and run.cancelled.
      required: [runId, sequence, type, source, visibility, payload, isTruncated, createdAt]
      properties:
        runId:
          type: string
        sequence:
          type: integer
        type:
          type: string
          description: >
            Event type. `agent.no_progress` means the runtime detected a
            suspected stuck loop, such as repeated failed commands, repeated
            file edits, or long provider output without state transitions.
        providerEventType:
          type: string
        source:
          type: string
        visibility:
          type: string
          enum: [public, internal, redacted]
        payload:
          type: object
          additionalProperties: true
        artifactRef:
          type: object
          properties:
            artifactId:
              type: string
            r2Key:
              type: string
        isTruncated:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Artifact:
      type: object
      required: [id, runId, kind, r2Key, sizeBytes, sha256, metadata, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        kind:
          type: string
        r2Key:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 120000
    ContinueRunResult:
      type: object
      required: [runId, turnNumber, conversationId]
      properties:
        runId:
          type: string
          description: New run id for the follow-up turn.
        turnNumber:
          type: integer
          minimum: 1
        conversationId:
          type: string
          description: Stable conversation id, equal to the first run id.
    RunTurn:
      type: object
      required: [id, runId, turnNumber, prompt, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
          description: Run id for this specific turn.
        turnNumber:
          type: integer
          minimum: 1
        prompt:
          type: string
        createdAt:
          type: string
          format: date-time
    RunTurnsResult:
      type: object
      required: [conversationId, items]
      properties:
        conversationId:
          type: string
          description: Stable conversation id, equal to the first run id.
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunTurn"
    CloseRunResult:
      type: object
      required: [closed, conversationId, reclaimed]
      properties:
        closed:
          type: boolean
        conversationId:
          type: string
          description: Stable conversation id, equal to the first run id.
        reclaimed:
          type: boolean
    AgentResponse:
      type: object
      required: [text, parts]
      properties:
        text:
          type: string
        parts:
          type: array
          items:
            type: object
            required: [type, text]
            properties:
              type:
                type: string
                enum: [text]
              text:
                type: string
        provider:
          type: string
        providerEventType:
          type: string
    RunSession:
      type: object
      required: [run, eventCursor, response, artifactManifest, artifacts]
      properties:
        run:
          $ref: "#/components/schemas/Run"
        eventCursor:
          type: object
          required: [lastEventSeq]
          properties:
            lastEventSeq:
              type: integer
        response:
          anyOf:
            - $ref: "#/components/schemas/AgentResponse"
            - type: "null"
        artifactManifest:
          type: object
          additionalProperties: true
        artifacts:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Artifact"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
